version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080" # Expose container's port 8080 to host
    environment:
      - DATABASE_URL=mongodb://db:27017/ticketoffdb
    depends_on:
      - db
    restart: always

  db:
    image: mongo:latest
    environment:
      MONGO_INITDB_DATABASE: ticketoffdb
    ports:
      - "27017:27017" # Expose container's port 27017 to host
